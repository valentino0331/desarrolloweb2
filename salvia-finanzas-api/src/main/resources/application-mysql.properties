# ===================================================================
# SALVIA FINANZAS - PERFIL MYSQL (application-mysql.properties)
# Para activar: pasar parámetro --spring.profiles.active=mysql
# ===================================================================

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/salviafinanzas_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

salviafinanzas.app.jwtSecret=SalviaFinanzasSecretKeyParaAutenticacionUTP2026SuperSeguraDe32BytesMinimo
salviafinanzas.app.jwtExpirationMs=86400000
