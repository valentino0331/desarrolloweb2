# ===================================================================
# SALVIA FINANZAS - API RESTFUL (SPRING BOOT 3.3 / JAVA 21)
# Configuración de Persistencia JPA / Hibernate y Seguridad JWT
# ===================================================================

# 1. Configuración del Servidor Web
server.port=8080
server.servlet.context-path=

# 2. Base de Datos H2 en Memoria (Configuración Predeterminada para Evaluación Ágil)
spring.datasource.url=jdbc:h2:mem:salviadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# 3. Consola Interactiva H2 (Disponible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# 4. Configuración de JPA e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# 5. Parámetros de Seguridad y Tokens JWT (JJWT 0.12.x)
salviafinanzas.app.jwtSecret=SalviaFinanzasSecretKeyParaAutenticacionUTP2026SuperSeguraDe32BytesMinimo
salviafinanzas.app.jwtExpirationMs=86400000

# 6. Logging de Transacciones y Seguridad
logging.level.org.springframework.security=INFO
logging.level.pe.edu.utp.salviafinanzas=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
